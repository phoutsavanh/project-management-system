*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans Lao',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:flex;min-height:100vh}.sidebar{width:258px;background:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0;box-shadow:0 10px 40px rgba(0,0,0,.08);z-index:30;overflow:auto;transition:.25s}.brand{display:flex;gap:12px;align-items:center;padding:8px 10px 17px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--v1),var(--p2));color:white;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 22px rgba(116,92,233,.25)}.brand h1{font:600 16px 'Noto Sans Lao';margin:0;line-height:1.25}.brand small{color:var(--muted)}.nav-title{font-size:12px;color:#aaa;margin:15px 10px 7px}.nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:14px;color:#555;text-decoration:none;transition:.22s}.nav a:hover{transform:translateX(3px);background:#faf7ff}.nav a.active{background:linear-gradient(135deg,#f2ecff,#fff0f7);color:#6b50d9;font-weight:700}.ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#f4f4f4}.main{margin-left:258px;width:calc(100% - 258px);padding:18px 22px 34px}.topbar{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.05);position:sticky;top:10px;z-index:20}.top-left,.profile{display:flex;align-items:center;gap:10px}.hamb{display:none;border:0;background:#f4f4f4;border-radius:12px;padding:10px}.school{font:500 15px 'Noto Sans Lao'}.system{font-size:12px;color:#888}.mode-pill{padding:6px 10px;border-radius:999px;background:#f1ecff;color:#6f56d9;font:500 12px 'Noto Sans Lao'}.mode-pill.real{background:#e9f9ef;color:#21864d}.avatar{width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,var(--b1),var(--t2));color:#fff;display:grid;place-items:center;font-weight:700}.content{padding-top:18px}.page{animation:fade .24s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:5px 0 16px}.page-head h2{font:600 25px 'Noto Sans Lao';margin:0}.page-head p{margin:2px 0;color:var(--muted)}.btn{border:0;border-radius:13px;padding:10px 14px;font:500 14px 'Noto Sans Lao';display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 7px 18px rgba(0,0,0,.08);transition:.2s;position:relative;overflow:hidden}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.primary{color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2))}.btn.success{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}.btn.warn{color:#fff;background:linear-gradient(135deg,var(--o1),var(--o2))}.btn.danger{color:#fff;background:linear-gradient(135deg,#df3f68,#ff7888)}.btn.purple{color:#fff;background:linear-gradient(135deg,var(--v1),var(--v2))}.btn.secondary{background:#fff;border:1px solid var(--line);color:#555;box-shadow:none}.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}.grid{display:grid;gap:14px}.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.click-card{transition:.22s}.click-card:hover{transform:translateY(-4px);box-shadow:0 16px 35px rgba(0,0,0,.09)}.metric{color:#fff;position:relative;overflow:hidden}.metric .num{font:600 28px 'Noto Sans Lao';margin-top:7px}.metric small{opacity:.9}.metric .bigico{position:absolute;right:12px;bottom:4px;font-size:52px;opacity:.17}.g-orange{background:linear-gradient(135deg,var(--o1),var(--o2))}.g-purple{background:linear-gradient(135deg,var(--v1),var(--v2))}.g-green{background:linear-gradient(135deg,var(--g1),var(--g2))}.g-blue{background:linear-gradient(135deg,var(--b1),var(--b2))}.g-pink{background:linear-gradient(135deg,var(--p1),var(--p2))}.g-teal{background:linear-gradient(135deg,var(--t1),var(--t2))}.g-yellow{background:linear-gradient(135deg,var(--y1),var(--y2))}.banner{height:156px;border-radius:24px;background:linear-gradient(110deg,rgba(116,92,233,.9),rgba(55,123,234,.75)),linear-gradient(135deg,#d8ccff,#bcecff);color:#fff;padding:25px;display:flex;align-items:flex-end;margin-bottom:14px;position:relative;overflow:hidden}.banner:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;background:rgba(255,255,255,.13);right:-70px;top:-100px}.banner h3{font:600 28px 'Noto Sans Lao';margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.field,.input{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px;min-width:145px;outline:none}.field:focus,.input:focus{border-color:#9f8ff1;box-shadow:0 0 0 3px rgba(116,92,233,.08)}.search{flex:1;min-width:230px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #f0f0f0;text-align:left;vertical-align:middle}.table th{font:500 13px 'Noto Sans Lao';color:#666;background:#fafafa;position:sticky;top:0}.table tr:hover td{background:#fffdfd}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.b-green{background:#eaf9f0;color:#1d8a4f}.b-orange{background:#fff1df;color:#b66b10}.b-blue{background:#eaf2ff;color:#3469c9}.b-pink{background:#ffe9f2;color:#bd3f75}.b-gray{background:#f0f0f0;color:#666}.b-purple{background:#f0ebff;color:#6d50d8}.progress{height:10px;background:#eee;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--t2));border-radius:999px}.section-title{font:500 16px 'Noto Sans Lao';margin:0 0 12px}.muted{color:var(--muted)}.money{font-weight:700}.list{display:grid;gap:10px}.list-item{padding:12px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.chart{height:225px;display:flex;align-items:end;gap:13px;padding:10px 4px 35px}.bar{flex:1;border-radius:10px 10px 4px 4px;position:relative;min-width:24px;background:linear-gradient(180deg,var(--v2),var(--b2))}.bar span{position:absolute;left:50%;transform:translateX(-50%);bottom:-32px;font-size:11px;color:#777;white-space:nowrap;text-align:center}.timeline{border-left:3px solid #d8d5ff;margin-left:8px;padding-left:18px}.tl{position:relative;margin:0 0 18px}.tl:before{content:"";position:absolute;left:-25px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--v1);box-shadow:0 0 0 4px #eeeaff}.modal-back{position:fixed;inset:0;background:rgba(20,20,20,.3);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:14px}.modal{width:min(850px,96vw);max-height:91vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.22);animation:pop .2s ease}@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.label{font-size:13px;font-weight:700;margin-bottom:5px;display:block}.input{width:100%}textarea.input{min-height:88px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.toast{position:fixed;right:18px;top:85px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 12px 35px rgba(0,0,0,.15);z-index:100;border-left:5px solid var(--g1);animation:slide .25s ease;max-width:min(420px,90vw)}@keyframes slide{from{transform:translateX(30px);opacity:0}}.loading{position:fixed;inset:0;background:rgba(255,255,255,.58);backdrop-filter:blur(2px);z-index:120;display:grid;place-items:center}.spinner{width:48px;height:48px;border:5px solid #e9e4ff;border-top-color:var(--v1);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 0 0,#fff0f7,transparent 38%),radial-gradient(circle at 100% 100%,#e7f5ff,transparent 36%),var(--bg);padding:20px}.login-wrap{width:min(500px,96vw);display:grid;grid-template-columns:1fr;background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 20px 65px rgba(0,0,0,.09)}.login-card{padding:40px;display:flex;flex-direction:column;justify-content:center}.login-card h2{font:600 24px 'Noto Sans Lao';margin:0 0 3px}.login-card .sub{color:#777;margin-bottom:24px;font-size:14px}.mode-box{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;background:#fafafa}.sep{height:1px;background:#eee;margin:17px 0}.kpi-row{display:flex;gap:8px;flex-wrap:wrap}.mini{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.tab{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:11px}.tab.active{background:#f0ebff;color:#6b50d9;border-color:#d8ccff;font-weight:700}.empty{text-align:center;color:#999;padding:32px}.skeleton{background:linear-gradient(90deg,#f1f1f1 25%,#fafafa 50%,#f1f1f1 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:70px}@keyframes sh{to{background-position:-200% 0}}
@media print{.sidebar,.topbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none;border:0}.modal-back{position:static;background:white;display:block;padding:0}.modal{width:100%;max-height:none;box-shadow:none;padding:0}.modal .actions{display:none}}
@media(max-width:1100px){.summary{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.sidebar{transform:translateX(-105%)}.sidebar.open{transform:none}.main{margin-left:0;width:100%;padding:12px}.hamb{display:inline-flex}.three{grid-template-columns:1fr}.topbar{top:5px}}
@media(max-width:560px){.summary{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}.profile .who{display:none}.banner{height:130px}.banner h3{font-size:20px}.login-card{padding:24px}.mode-pill{display:none}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-wrap">
    <section class="login-card">
      <div style="text-align: center; margin-bottom: 20px;">
        <div class="logo" style="margin: 0 auto 15px;">📚</div>
        <h2 style="font-weight: 600;">ເຂົ້າສູ່ລະບົບ</h2>
        <div class="sub">ລະບົບບໍລິຫານຈັດການໂຄງການ</div>
      </div>
      <label class="label">ຊື່ຜູ້ໃຊ້ (Username)</label><input id="loginUser" class="input" autocomplete="username" onkeydown="if(event.key==='Enter')realLogin()">
      <div style="height:10px"></div><label class="label">ລະຫັດຜ່ານ (Password)</label><input id="loginPass" type="password" class="input" autocomplete="current-password" onkeydown="if(event.key==='Enter')realLogin()">
      <div style="height:14px"></div><button class="btn primary" style="width:100%" onclick="realLogin()">🔐 ເຂົ້າສູ່ລະບົບ</button>
      <div style="text-align:center;margin-top:14px"><button type="button" class="btn secondary sm" style="font-size:12px;opacity:.85" onclick="openApiConfigModal()">⚙️ ຕັ້ງຄ່າ API URL (ສຳລັບ Vercel)</button></div>
    </section>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside id="sidebar" class="sidebar"><div class="brand"><div class="logo">📚</div><div><h1 id="brandSystem">Project Manager</h1><small id="brandSchool">ອົງກອນ</small></div></div><div class="nav-title">ເມນູຫຼັກ</div><nav class="nav" id="nav"></nav></aside>
  <main class="main"><header class="topbar"><div class="top-left"><button class="hamb" onclick="toggleSide()">☰</button><div><div class="school" id="topSchool">ອົງກອນ</div><div class="system" id="topSystem">ລະບົບບໍລິຫານຈັດການໂຄງການ</div></div><span id="modePill" class="mode-pill real">● ລະບົບຈິງ</span></div><div class="profile"><span>🔔</span><div class="avatar" id="avatar">A</div><div class="who"><b id="who">Admin</b><div class="muted" id="roleText" style="font-size:12px"></div></div><button class="btn secondary sm" onclick="openApiConfigModal()" title="API URL Settings">⚙️</button> <button class="btn secondary sm" onclick="appLogout()">ອອກ</button></div></header><div class="content" id="content"></div></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div><div id="loadingRoot"></div>

<script src="config.js"></script>

<script>
const App={token:null,user:null,settings:{},departments:[],view:'dashboard',projectPage:1,projectPageSize:10,cache:{projects:[],users:[],logs:[]}};
const MENU=[
 ['dashboard','🏠','ໜ້າຫຼັກ',['admin','head','teacher']],['projects','📁','ໂຄງການ',['admin','head','teacher']],['activities','🗂️','ກິດຈະກຳ',['admin','head','teacher']],['budget','💰','ງົບປະມານ',['admin','head','teacher']],['expenses','🧾','ເບີກຈ່າຍ',['admin','head','teacher']],['progress','📈','ຕິດຕາມຄວາມຄືບໜ້າ',['admin','head','teacher']],['reports','📑','ລາຍງານ',['admin','head','teacher']],['files','📎','ເອກະສານ',['admin','head','teacher']],['users','👥','ຜູ້ໃຊ້ງານ',['admin']],['departments','🏢','ພະແນກ/ຝ່າຍ',['admin']],['settings','⚙️','ຕັ້ງຄ່າ',['admin']],['backup','💾','ສຳຮອງຂໍ້ມູນ',['admin']],['logs','🕘','ປະຫວັດການນຳໃຊ້',['admin']]
];

// ==================== API CONNECTOR ====================
function getGasApiUrl() {
  if (window.DEFAULT_GAS_API_URL && window.DEFAULT_GAS_API_URL.trim()) {
    return window.DEFAULT_GAS_API_URL.trim();
  }
  return (localStorage.getItem('GAS_API_URL') || '').trim();
}

function setGasApiUrl(url) {
  url = (url || '').trim();
  if (url) localStorage.setItem('GAS_API_URL', url);
  else localStorage.removeItem('GAS_API_URL');
}

function openApiConfigModal() {
  const current = getGasApiUrl();
  modal(`
    <h3 class="section-title">⚙️ ຕັ້ງຄ່າ Google Apps Script API URL</h3>
    <p class="muted" style="margin-bottom:12px;font-size:13px;line-height:1.5">
      ເມື່ອ Deploy ໃນ Vercel / GitHub, ລະບົບຕ້ອງການລິ້ງ Web App URL (ທີ່ລົງທ້າຍດ້ວຍ <code>/exec</code>) ຈາກ Google Apps Script ເພື່ອເຊື່ອມຕໍ່ກັບ Google Sheets.
    </p>
    <label class="label">Google Apps Script Web App URL</label>
    <input id="cfgApiUrl" class="input" placeholder="https://script.google.com/macros/s/.../exec" value="${attr(current)}">
    <div style="font-size:12px;color:#888;margin-top:6px">💡 ວິທີເອົາ: ໃນ Apps Script ກົດ Deploy > Manage deployments > Copy Web App URL</div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">ປິດ</button>
      <button class="btn primary" onclick="saveApiConfig()">💾 ບັນທຶກ</button>
    </div>
  `);
}

function saveApiConfig() {
  const u = val('cfgApiUrl');
  if (!u) {
    setGasApiUrl('');
    toast('ລຶບ URL ແລ້ວ');
  } else if (!u.startsWith('https://script.google.com/macros/s/')) {
    return toast('URL ຕ້ອງຂຶ້ນຕົ້ນດ້ວຍ https://script.google.com/macros/s/...', 'error');
  } else {
    setGasApiUrl(u);
    toast('ບັນທຶກ Web App URL ຮຽບຮ້ອຍແລ້ວ! ✅');
  }
  closeModal();
}

async function callBackend(action, ...args) {
  // 1. ຖ້າເປີດໃນ Google Apps Script Web App ໂດຍກົງ
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function(err){ reject(new Error(err ? (err.message || err) : 'Error')); });
      if (typeof runner[action] !== 'function') {
        reject(new Error('Function "' + action + '" ບໍ່ພົບໃນ Google Apps Script'));
        return;
      }
      runner[action].apply(runner, args);
    });
  }

  // 2. ຖ້າເປີດໃນ Vercel / Localhost -> ເອີ້ນຜ່ານ HTTP POST Fetch
  const apiUrl = getGasApiUrl();
  if (!apiUrl) {
    openApiConfigModal();
    throw new Error('ກະລຸນາກຳນົດ Web App URL ຂອງ Google Apps Script ກ່ອນ (ຄລິກປຸ່ມ ⚙️)');
  }

  const res = await fetch(apiUrl, {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({ action: action, args: args })
  });

  if (!res.ok) {
    throw new Error('ເຊີບເວີຕອບກັບດ້ວຍລະຫັດ: ' + res.status);
  }

  const json = await res.json();
  return json;
}

// ---------------- API ROUTER ----------------
async function api(method,...args){
 showLoading(true);
 try{
  const res = await callBackend(method, App.token, ...args);
  if(!res || !res.success) throw new Error(res ? res.message : 'ເກີດຂໍ້ຜິດພາດ');
  return res.data;
 }catch(e){
  toast(e.message || String(e),'error');
  if(String(e.message || '').indexOf('ໝົດອາຍຸ') >= 0) appLogout(true);
  throw e;
 }
 finally{showLoading(false)}
}

// ---------------- AUTH ----------------
function val(id){
  var el = document.getElementById(id);
  if(!el) return '';
  return el.value ? el.value.trim() : '';
}

async function realLogin(){
  var u = val('loginUser');
  var p = val('loginPass');
  if(!u || !p) return toast('ກະລຸນາປ້ອນ Username ແລະ Password', 'error');

  showLoading(true);
  try {
    const res = await callBackend('login', u, p);
    if(!res || !res.success) throw new Error(res ? res.message : 'ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ');
    
    App.token = res.data.token;
    App.user = res.data.user;
    App.settings = res.data.settings || {};
    try {
      const boot = await api('getAppBootstrap');
      if (boot) {
        App.departments = boot.departments || [];
        App.settings = boot.settings || App.settings;
      }
    } catch(errBoot) {
      console.warn('Bootstrap note:', errBoot);
    }
    enterApp();
  } catch(e) {
    toast(e.message || String(e), 'error');
  } finally {
    showLoading(false);
  }
}

function enterApp(){
 document.getElementById('loginView').classList.add('hidden');
 document.getElementById('appView').classList.remove('hidden');
 applyBrand();
 buildNav();
 go('dashboard');
}

async function appLogout(silent){
 try{ if(App.token && !silent) await callBackend('logout', App.token); }catch(e){}
 App.token = null; App.user = null;
 document.getElementById('appView').classList.add('hidden');
 document.getElementById('loginView').classList.remove('hidden');
 document.getElementById('modalRoot').innerHTML = '';
}

function applyBrand(){
 const s = App.settings || {};
 setText('brandSystem', s.systemName || 'ລະບົບບໍລິຫານຈັດການໂຄງການ');
 setText('brandSchool', s.schoolName || 'ອົງກອນ');

function metric(t,n,i,g){ return `<div class="card metric ${g}"><small>${t}</small><div class="num">${n}</div><div class="bigico">${i}</div></div>`; }
function barChart(rows){
 if(!rows.length) return empty('ຍັງບໍ່ມີຂໍ້ມູນ');
 const max = Math.max(...rows.map(x => Number(x.value)||0), 1);
 return `<div class="chart">${rows.map(x => `<div class="bar" style="height:${55 + (Number(x.value)/max*120)}px"><span>${esc(x.label || x.key)}<br><b>${formatNumber(x.value)}</b></span></div>`).join('')}</div>`;
}

async function loadProjectTable(){
 try{
  const f = { search:val('pq'), fiscalYear:val('py'), departmentId:val('pd'), status:val('ps') };
  const rows = await api('listProjects', f);
  const sort = val('pSort') || 'updated';
  rows.sort((a,b) => sort==='name' ? String(a.projectName).localeCompare(String(b.projectName),'lo') : sort==='budgetDesc' ? num(b.budget)-num(a.budget) : sort==='progressDesc' ? num(b.progressPercent)-num(a.progressPercent) : String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
  App.cache.projects = rows;
  renderProjectPage(1);
 }catch(e){}
}

function renderProjectPage(page){
 const rows = App.cache.projects || [];
 const size = App.projectPageSize || 10;
 const total = Math.max(1, Math.ceil(rows.length/size));
 App.projectPage = Math.min(Math.max(1, page), total);
 const start = (App.projectPage-1) * size;
 const slice = rows.slice(start, start+size);
 const host = document.getElementById('projectTable');
 if(!host) return;
 host.innerHTML = projectTable(slice) + `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px"><span class="muted">ທັງໝົດ ${rows.length} ລາຍການ • ໜ້າ ${App.projectPage}/${total}</span><div><button class="btn secondary sm" ${App.projectPage<=1?'disabled':''} onclick="renderProjectPage(${App.projectPage-1})">← ກ່ອນໜ້າ</button> <button class="btn secondary sm" ${App.projectPage>=total?'disabled':''} onclick="renderProjectPage(${App.projectPage+1})">ຖັດໄປ →</button></div></div>`;
}

function clearProjectFilters(){
 ['pq','py','pd','ps'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
 loadProjectTable();
}

function projectTable(rows){

async function uploadFileAction(){
 const input = document.getElementById('upFile'); const file = input.files[0];
 if(!file) return toast('ກະລຸນາເລືອກໄຟລ໌','error');
 const data = await readFileBase64(file);
 try{ await api('uploadProjectFile',{projectId:val('upProject'), activityId:'', fileName:file.name, mimeType:file.type||'application/octet-stream', base64:data}); closeModal(); toast('ອັບໂຫຼດໄຟລ໌ແລ້ວ'); renderFiles(); }catch(e){}

async function deleteFileAction(id){ if(!confirm('ລຶບໄຟລ໌ນີ້ຫຼືບໍ່?')) return; try{ await api('deleteProjectFile', id); toast('ລຶບໄຟລ໌ແລ້ວ'); renderFiles(); }catch(e){} }

function readFileBase64(file){
 return new Promise((resolve,reject)=>{
  const r = new FileReader();
  r.onload = () => resolve(String(r.result).split(',')[1]);
  r.onerror = reject;
  r.readAsDataURL(file);
 });
}

// ---------------- COMMON UI ----------------
function moduleShell(title,sub,action,bodyId){ return `<div class="page"><div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${action||''}</div><div class="card" id="${bodyId}"><div class="skeleton"></div></div></div>`; }
function statusBadge(s){
 let c = ['ສຳເລັດ','ອະນຸມັດ','ນຳໃຊ້ງານ'].indexOf(s)>=0 ? 'b-green' : ['ຫຼ້າຊ້າ','ປິດນຳໃຊ້ງານ','ຍົກເລີກ'].indexOf(s)>=0 ? 'b-pink' : ['ກຳລັງດຳເນີນງານ','ລໍຖ້າກວດສອບ'].indexOf(s)>=0 ? 'b-orange' : 'b-blue';
 return `<span class="badge ${c}">${esc(s||'-')}</span>`;
}
function skeletonPage(){ document.getElementById('content').innerHTML = `<div class="grid summary"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`; }
function modal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function toast(msg,type){
 type = type || 'success';
 const t = document.createElement('div');
 t.className = 'toast';
 t.style.borderLeftColor = type==='error' ? '#e64a6b' : type==='warning' ? '#ff9d28' : '#26B96E';
 t.textContent = msg;
 document.getElementById('toastRoot').appendChild(t);
 setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2800);
}
function showLoading(on){ document.getElementById('loadingRoot').innerHTML = on ? '<div class="loading"><div class="spinner"></div></div>' : ''; }
function empty(t){ return `<div class="empty">${esc(t)}</div>`; }
function setText(id,t){ const el = document.getElementById(id); if(el) el.textContent = t; }
function money(v){ return Number(v||0).toLocaleString('lo-LA',{maximumFractionDigits:2}) + ' ກີບ'; }
function formatNumber(v){ return Number(v||0).toLocaleString('lo-LA'); }
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function esc(s){
 return String(s || '').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m] });
}
function attr(s){ return esc(s); }
function nl(s){ return esc(s).replace(/\n/g, '<br>'); }
function todayISO(){
 const d = new Date(), off = d.getTimezoneOffset();
 return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}
function dateForInput(s){
 s = String(s||'');
 return /^\\d{4}-\\d{2}-\\d{2}$/.test(s) ? s : '';
}
